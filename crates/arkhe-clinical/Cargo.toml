[package]
name = "arkhe-clinical"
version = "1.0.0"
edition = "2021"
authors = ["ARKHE Team <team@arkhe.io>"]
license = "MIT OR Apache-2.0"
description = "ARKHE Clinical — Platform for CJD clinical trials with real-time analytics and regulatory compliance"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Cryptography for audit signatures
ed25519-dalek = { version = "3.0", features = ["serde"], optional = true }
rand = "0.8"
sha2 = "0.10"

# Statistical analysis
statrs = "0.16"
ndarray = "0.15"

# Serialization
yaml-rust = "0.4"
hex = { version = "0.4.3", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3.14"

[features]
default = []
with_audit_signatures = ["ed25519-dalek"]
ed25519-dalek = ["dep:ed25519-dalek"]
